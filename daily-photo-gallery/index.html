<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>david's Daily Photo Challenges</title>
<link rel="icon" href="/favicon-32x32.jpg" sizes="32x32">
<link rel="icon" href="/favicon-192x192.jpg" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.jpg">
<meta name="description" content="david's daily photo challenges">
<style>
:root {
  color-scheme: dark light;
  --bg: #0d0d0f;
  --bg-raised: #17171b;
  --fg: #f2f2f4;
  --fg-dim: #9a9aa4;
  --line: #2a2a31;
  --accent: #f2f2f4;
  --gap: 12px;
  --radius: 4px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fbfbfa;
    --bg-raised: #ffffff;
    --fg: #16161a;
    --fg-dim: #6d6d78;
    --line: #e2e2e0;
    --accent: #16161a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0 auto;
  background: var(--bg);
  color: var(--fg);
  font-family: Inter, Roboto, 'Helvetica Neue', 'Arial Nova', 'Nimbus Sans', Arial, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  max-width: 1600px;
  padding: 16px 24px;
}

header {
  margin: 0 auto 24px;
}

header h1 {
  margin: 12px 0 0;
  font-size: clamp(24px, 6vw, 48px);
  line-height: 1;
}

.subtitle {
  margin: 8px 0 0;
  color: var(--fg-dim);
}

.years {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--gap);
}

@media (min-width: 620px) {
  .years { grid-template-columns: repeat(3, 1fr); }
}

.year {
  display: grid;
  grid-template-rows: auto auto auto;
  gap: 2px;
  padding: var(--gap);
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: inherit;
  text-decoration: none;
  transition: border-color 0.25s, transform 0.25s;
}

.year:hover,
.year:focus-visible {
  border-color: var(--accent);
  transform: translateY(-2px);
}

.year:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.year img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius);
  margin-bottom: var(--gap);
  background: var(--bg);
}

.year-label {
  font-size: 24px;
  font-weight: 600;
}

.year-count {
  color: var(--fg-dim);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <h1>david's Daily Photo Challenges</h1>
  <div class="subtitle">For several years I set a personal challenge to take one photo per day. You can click into an individual year to see two views of each year's collection.</div>
</header>

<main class="years">
  <a class="year" href="2020/" data-year="2020">
    <img src="2020/img/thumb/1-1.webp" alt="" decoding="async">
    <span class="year-label">2020</span>
    <span class="year-count">366 photos</span>
  </a>
  <a class="year" href="2022/" data-year="2022">
    <img src="2022/img/thumb/1-1.webp" alt="" decoding="async">
    <span class="year-label">2022</span>
    <span class="year-count">365 photos</span>
  </a>
  <a class="year" href="2024/" data-year="2024">
    <img src="2024/img/thumb/1-1.webp" alt="" decoding="async">
    <span class="year-label">2024</span>
    <span class="year-count">361 photos</span>
  </a>
</main>

<script type="module">
// Each cover shows a different day on every visit.
const MISSING = {
  2020: [],
  2022: [],
  2024: ['10-21', '10-22', '10-23', '10-24', '10-25']
};

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function randomDay(year) {
  const missing = new Set(MISSING[year]);
  const ids = [];
  for (let month = 1; month <= 12; month++) {
    for (let day = 1; day <= daysInMonth(year, month); day++) {
      const id = `${month}-${day}`;
      if (!missing.has(id)) ids.push(id);
    }
  }
  return ids[Math.floor(Math.random() * ids.length)];
}

for (const card of document.querySelectorAll('.year[data-year]')) {
  const year = Number(card.dataset.year);
  if (!(year in MISSING)) continue;
  card.querySelector('img').src = `${year}/img/thumb/${randomDay(year)}.webp`;
}
</script>
</body>
</html>
