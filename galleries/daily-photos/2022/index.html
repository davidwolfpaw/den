<style>
  :root {
    color-scheme: light dark;

    --base: #fefefe;
    --base-dark: #123260;
    --foreground: #0b254c;
    --foreground-light: #fefefe;
    --primary: #1fa6d8;
    --secondary: #f25d54;
    --secondary-dark: #c47a7a;
    --accent: #861d9b;
    --accent-dark: #5d1470;
    --gold: #d4af37;
    --tooltip-bg: #330a0a;

    --pride-black: #000000;
    --pride-brown: #784f16;
    --pride-red: #e40303;
    --pride-orange: #ff8c00;
    --pride-yellow: #ffed00;
    --pride-green: #008026;
    --pride-blue: #004dff;
    --pride-purple: #750787;
    --pride-silver: #bcc4c7;
    --pride-white: #f2f2f2;
    --pride-light-green: #b7f584;

    --rainbow-red: #ff0000;
    --rainbow-orange: #ff7f00;
    --rainbow-yellow: #ffff00;
    --rainbow-lime: #00ff00;
    --rainbow-blue: #0000ff;
    --rainbow-indigo: #4b0082;
    --rainbow-violet: #8b00ff;

    --text: var(--foreground);
    --background: var(--base);
    --surface: var(--base);
    --text-dim: color-mix(in srgb, var(--text) 68%, var(--background));
    --link: var(--pride-purple);
    --link-visited: var(--accent-dark);
    --link-hover: var(--secondary);
    --role-primary: var(--primary);
    --primary-ink: var(--foreground);
    --role-secondary: var(--secondary);
    --role-accent: var(--accent);
    --rule: rgba(11, 37, 76, 0.12);

    --font-serif: Piazzolla, 'Source Serif Pro', 'Iowan Old Style', Palatino, Georgia, serif;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --font-system: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --text-small: 1rem;
    --text-medium: clamp(1.125rem, 1.1rem + 0.25vw, 1.25rem);
    --text-large: clamp(1.75rem, 1.7rem + 0.5vw, 1.875rem);
    --text-x-large: 2.25rem;
    --text-xx-large: clamp(4rem, 3.5rem + 2.5vw, 5rem);

    --weight-body: 400;
    --weight-heading: 600;
    --weight-strong: 700;
    --weight-display: 900;

    --leading-body: 1.6;
    --leading-heading: 1.2;

    --space-30: clamp(1.5rem, 5vw, 2rem);
    --space-40: clamp(1.8rem, 1.8rem + ((1vw - 0.48rem) * 2.885), 3rem);
    --space-50: clamp(2.5rem, 8vw, 4.5rem);
    --space-60: clamp(3.75rem, 10vw, 7rem);
    --space-70: clamp(5rem, 5.25rem + ((1vw - 0.48rem) * 9.096), 8rem);
    --space-80: clamp(7rem, 14vw, 11rem);
    --block-gap: 1.5rem;
    --page-pad: var(--space-30);

    --content-width: 44rem;
    --wide-width: 64rem;

    --radius-button: 10px;
    --radius-tag: 0;

    --shadow-primary: -10px 10px var(--role-accent);
    --shadow-crisp: var(--background) -6px 6px 0 -4px, var(--role-accent) -6px 6px 0 0;
    --shadow-crisp-primary: var(--background) -6px 6px 0 -4px, var(--role-primary) -6px 6px 0 0;

    --ease-theme: 0.6s;    --ease-ui: 0.2s;  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --text: var(--foreground-light);
      --background: var(--base-dark);
      --surface: var(--foreground);
      --link: var(--pride-silver);
      --link-visited: #99a4a8;
      --link-hover: var(--secondary-dark);
      --role-secondary: var(--secondary-dark);
      --role-accent: var(--accent-dark);
      --rule: rgba(254, 254, 254, 0.12);
    }
  }

  :root[data-theme="dark"] {
    --text: var(--foreground-light);
    --background: var(--base-dark);
    --surface: var(--foreground);
    --link: var(--pride-silver);
    --link-visited: #99a4a8;
    --link-hover: var(--secondary-dark);
    --role-secondary: var(--secondary-dark);
    --role-accent: var(--accent-dark);
    --rule: rgba(254, 254, 254, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 var(--page-pad);
    background: var(--background);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: var(--text-medium);
    font-weight: var(--weight-body);
    font-style: normal;
    line-height: var(--leading-body);
    transition: background-color var(--ease-theme), color var(--ease-theme);
  }

  .content,
  main > *:not(.wide):not(.full) {
    max-width: var(--content-width);
    margin-inline: auto;
  }

  .wide { max-width: var(--wide-width); margin-inline: auto; }
  .full { max-width: none; }

  main > * + * { margin-top: var(--block-gap); }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-serif);
    font-weight: var(--weight-heading);
    font-style: normal;
    line-height: var(--leading-heading);
    margin: 0;
  }

  h1 { font-size: var(--text-x-large); }
  h2 { font-size: var(--text-large); }
  h3 { font-size: var(--text-medium); }

  .display {
    font-size: var(--text-xx-large);
    font-weight: var(--weight-display);
    line-height: 1;
  }

  small, .small { font-size: var(--text-small); }

  a { color: var(--link); text-decoration: underline; transition: color var(--ease-ui); }
  a:hover, a:focus { color: var(--link-hover); }
  a:visited { color: var(--link-visited); }

  :focus-visible { outline: 2px solid var(--role-primary); outline-offset: 2px; }

  header { padding-block: var(--space-30); }

  .button {
    display: inline-block;
    padding: 0.6em 1.2em;
    border: 0;
    border-radius: var(--radius-button);
    background: var(--role-primary);
    color: var(--primary-ink);
    font: inherit;
    font-weight: var(--weight-heading);
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--ease-ui), box-shadow var(--ease-ui);
  }

  .button:hover,
  .button:visited:hover { background: var(--accent-dark); color: var(--base); box-shadow: var(--shadow-crisp-primary); }
  .button:focus { background: var(--role-primary); color: var(--primary-ink); }
  .button:active { background: var(--accent-dark); color: var(--base); }
  .button:visited { color: var(--primary-ink); }

  .button-quiet {
    background: none;
    color: var(--text);
    box-shadow: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    opacity: 0.45;
    padding: 2px 0;
    font-weight: var(--weight-heading);
    transition: opacity var(--ease-ui), border-color var(--ease-ui);
  }

  .button-quiet:hover,
  .button-quiet[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--role-accent); color: var(--text); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: var(--radius-tag);
    background: var(--role-primary);
    color: var(--primary-ink);
    font-size: 0.7rem;
    font-weight: var(--weight-strong);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
    gap: var(--block-gap);
  }

  .card {
    display: block;
    padding: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    text-decoration: none;
    transition: box-shadow var(--ease-ui);
  }

  a.card,
  a.card:hover,
  a.card:focus,
  a.card:visited { color: var(--text); }

  .card:hover { box-shadow: var(--shadow-crisp); }
  .card:hover .card-title { color: var(--role-accent); }

  .card-title {
    font-family: var(--font-serif);
    font-size: var(--text-large);
    font-weight: var(--weight-strong);
    transition: color var(--ease-ui);
  }

  .card-meta { font-size: var(--text-small); opacity: 0.75; margin: 0.15rem 0 0; }

  .card > :last-child { margin-bottom: 0; }

  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 0;
    object-fit: cover;
    background: var(--background);
    margin-bottom: 0.5rem;
  }

  @keyframes rainbow-drift {
    from { background-position: 0% 0; }
    to { background-position: -200% 0; }
  }

  .rainbow-text {
    font-size: 2em;
    font-weight: var(--weight-strong);
    background-image: linear-gradient(90deg,
      var(--rainbow-red), var(--rainbow-orange), var(--rainbow-yellow), var(--rainbow-lime), var(--rainbow-blue), var(--rainbow-indigo), var(--rainbow-violet),
      var(--rainbow-red), var(--rainbow-orange), var(--rainbow-yellow), var(--rainbow-lime), var(--rainbow-blue), var(--rainbow-indigo), var(--rainbow-violet),
      var(--rainbow-red));
    background-size: 200% 100%;
    background-repeat: repeat-x;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: rainbow-drift 18s linear infinite;
  }

  .rainbow-text:hover { animation-direction: reverse; }

  footer {
    max-width: var(--content-width);
    margin: var(--space-50) auto 0;
    padding-block: var(--space-30);
    border-top: 1px solid var(--rule);
    font-size: var(--text-small);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
<style>
body { max-width: 1600px; margin-inline: auto; }

main > *:not(.wide):not(.full) { max-width: none; margin-inline: 0; }

header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--block-gap);
}

header h1 { margin-top: 0.25rem; }

.views {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--rule);
  border-radius: var(--radius-button);
}

.views button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-weight: var(--weight-heading);
  padding: 0.5rem 0.9rem;
  border-radius: calc(var(--radius-button) - 2px);
  cursor: pointer;
  transition: background-color var(--ease-ui), color var(--ease-ui);
}

.views button:hover { color: var(--text); }

.views button[aria-pressed="true"] {
  background: var(--role-primary);
  color: var(--primary-ink);
}

.status {
  color: var(--text-dim);
  padding: var(--space-50) 0;
  text-align: center;
}

.month-heading {
  margin: var(--space-50) 0 var(--block-gap);
  padding-bottom: 0.75rem;
  border-bottom: 2px solid var(--text);
}

.month-heading h2 {
  margin: 0;
  font-size: clamp(26px, 3.4vw, 40px);
}

.month-heading.compact { margin: 0.75rem 0; }

.tile {
  appearance: none;
  border: 0;
  padding: 0;
  margin: 0;
  background: var(--surface);
  overflow: hidden;
  cursor: zoom-in;
  position: relative;
  display: block;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity var(--ease-ui) ease, transform var(--ease-ui) ease;
  opacity: 0;
}

.tile img.loaded { opacity: 1; }
.tile:hover img { transform: scale(1.1); }

.tile:focus-visible {
  outline: 2px solid var(--role-primary);
  outline-offset: 3px;
}

.tile .daymark {
  position: absolute;
  left: 0.75rem;
  bottom: 0.75rem;
  font-size: var(--text-small);
  font-weight: var(--weight-strong);
  padding: 2px 8px;
  letter-spacing: 0.06em;
  background: var(--foreground);
  color: var(--base);
  pointer-events: none;
}

:root { --row-gap: 12px; }

.row {
  display: flex;
  gap: var(--row-gap);
  margin-bottom: var(--row-gap);
}

.row .tile { flex: 0 0 auto; }

.calendar {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-30);
}

@media (min-width: 560px) {
  .calendar { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 900px) {
  .calendar { grid-template-columns: repeat(3, 1fr); }
}

.calendar-month { min-width: 0; }

.sheet {
  border: 1px solid var(--rule);
  overflow: hidden;
  background: var(--rule);
}

.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  background: var(--rule);
  border-bottom: 1px solid var(--rule);
}

.weekdays span {
  background: var(--surface);
  padding: 7px 0;
  text-align: center;
  color: var(--text-dim);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.days .cell {
  aspect-ratio: 1;
  background: var(--background);
  min-width: 0;
}

.days .cell.blank { background: var(--surface); opacity: 0.5; }

.days .cell.missing {
  position: relative;
  background: var(--surface);
}

.days .tile { cursor: zoom-in; }

.days .daymark {
  position: absolute;
  top: 4px;
  left: 4px;
  bottom: auto;
  padding: 1px 4px;
  letter-spacing: 0;
}

.days .cell.missing .daymark {
  background: none;
  color: var(--text-dim);
  opacity: 0.5;
}

.days .tile:focus-visible { outline-offset: -2px; }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgb(11 37 76 / 0.94);
  display: grid;
  place-items: center;
  padding: var(--space-30);
}

.lightbox[hidden] { display: none; }

.lb-figure {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--block-gap);
  max-width: 100%;
  max-height: 100%;
}

.lb-figure img {
  max-width: min(1600px, 100%);
  max-height: calc(100vh - 170px);
}

.lb-figure figcaption {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: var(--block-gap);
  text-align: center;
  color: var(--foreground-light);
  max-width: 68ch;
}

.lb-cw {
  align-self: center;
  border: 1px solid var(--pride-silver);
  padding: 1px 9px;
  font-size: var(--text-small);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.lightbox a,
.lightbox a:visited { color: var(--foreground-light); }
.lightbox a:hover { color: var(--gold); }

.lightbox button {
  position: fixed;
  display: grid;
  place-items: center;
  appearance: none;
  padding: 0;
  background: var(--primary);
  border: 0;
  border-radius: var(--radius-button);
  color: var(--primary-ink);
  font-family: var(--font-sans);
  line-height: 1;
  cursor: pointer;
  transition: background-color var(--ease-ui), box-shadow var(--ease-ui);
}

.lightbox button:hover { background: var(--accent); color: var(--base); box-shadow: var(--shadow-crisp-primary); }
.lightbox button:focus-visible { outline: 2px solid var(--foreground-light); outline-offset: 2px; }

.lb-close {
  top: var(--space-30);
  right: var(--space-30);
  width: 44px;
  height: 44px;
  font-size: 28px;
}

.lb-nav {
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 64px;
  font-size: 32px;
}

.lb-prev { left: var(--space-30); }
.lb-next { right: var(--space-30); }

@media (max-width: 640px) {
  .lb-nav { top: auto; bottom: 16px; transform: none; height: 44px; }
}
</style>

const SHORT_MONTHS = MONTHS.map(name => name.slice(0, 3));
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const TARGET_ROW_HEIGHT = 300;          // rows settle near this; wide photos push shorter
const TARGET_ROW_HEIGHT_NARROW = 220;   // phones: shorter rows fit more of the year on screen
const GAP = 12;                         // keep in sync with --row-gap above
const STORAGE_KEY = 'daily-photo-gallery:view';

const gallery = document.querySelector('#gallery');
const viewButtons = [...document.querySelectorAll('.views button')];
const lightbox = document.querySelector('#lightbox');
const lbImage = document.querySelector('#lb-image');
const lbDate = document.querySelector('#lb-date');
const lbCaption = document.querySelector('#lb-caption');
const lbCw = document.querySelector('#lb-cw');

let view = localStorage.getItem(STORAGE_KEY) === 'calendar' ? 'calendar' : 'rows';
let lightboxIndex = -1;
let lastFocused = null;

/* ---------- data ---------- */

// The build inlines photos as [id, ratio, color, alt, caption, cw]
const { year, photos: rawPhotos } = window.__GALLERY__;

const data = {
  year,
  photos: rawPhotos.map(([id, ratio, color, alt, caption, cw]) => {
    const [month, day] = id.split('-').map(Number);
    return {
      id, month, day, ratio, color,
      alt: alt || '',
      caption: caption || '',
      cw: cw || '',
      thumb: `img/thumb/${id}.webp`,
      tile: `img/tile/${id}.webp`,
      full: `img/full/${id}.webp`
    };
  })
};

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate();
}

function formatDate(photo) {
  return `${MONTHS[photo.month - 1]} ${photo.day}, ${data.year}`;
}

/**
 * Real alt text from the original post when there is some, otherwise the date
 */
function altFor(photo) {
  return photo.alt || `Photo from ${formatDate(photo)}`;
}

/* ---------- tiles ---------- */

function makeTile(photo, index, { width, height, showDay, src = photo.thumb }) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'tile';
  button.dataset.index = String(index);
  button.style.background = photo.color;
  if (width) button.style.width = `${width}px`;
  if (height) button.style.height = `${height}px`;
  button.setAttribute('aria-label', `Open ${formatDate(photo)}`);

  const img = document.createElement('img');
  img.src = src;
  img.alt = altFor(photo);
  img.loading = 'lazy';
  img.decoding = 'async';
  if (img.complete) img.classList.add('loaded');
  else img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
  button.append(img);

  if (showDay) {
    const mark = document.createElement('span');
    mark.className = 'daymark';
    mark.textContent = showDay === 'full'
      ? `${SHORT_MONTHS[photo.month - 1]} ${photo.day}`
      : String(photo.day);
    button.append(mark);
  }
  return button;
}

function monthHeading(month, variant) {
  const header = document.createElement('div');
  header.className = variant ? `month-heading ${variant}` : 'month-heading';
  const h2 = document.createElement('h2');
  h2.textContent = MONTHS[month - 1];
  header.append(h2);
  return header;
}

/* ---------- justified rows ---------- */

/**
 * Fills rows so each one spans the container exactly. After adding a photo we
 * check whether the row with it or without it lands closer to the target
 * height, and close whichever wins — a plain "break on overflow" loop leaves
 * squat rows whenever a panorama lands next to a portrait on a narrow screen.
 * Returns [{ items, height, widths }] with widths already rounded so they sum
 * to the container width.
 */
function buildRows(photos, containerWidth) {
  const target = containerWidth < 600 ? TARGET_ROW_HEIGHT_NARROW : TARGET_ROW_HEIGHT;
  const rows = [];
  let current = [];
  let ratioSum = 0;

  const heightFor = (count, ratios) => (containerWidth - GAP * (count - 1)) / ratios;

  const close = (items, ratios) => {
    const height = heightFor(items.length, ratios);
    rows.push({ items, height: Math.round(height), ratios });
  };

  for (const photo of photos) {
    const withPhoto = heightFor(current.length + 1, ratioSum + photo.ratio);

    if (withPhoto < target && current.length) {
      const without = heightFor(current.length, ratioSum);
      if (Math.abs(without - target) < Math.abs(withPhoto - target)) {
        close(current, ratioSum);
        current = [photo];
        ratioSum = photo.ratio;
        continue;
      }
      close([...current, photo], ratioSum + photo.ratio);
      current = [];
      ratioSum = 0;
      continue;
    }

    current.push(photo);
    ratioSum += photo.ratio;
    if (withPhoto < target) {
      close(current, ratioSum);
      current = [];
      ratioSum = 0;
    }
  }

  if (current.length) {
    // A short final row keeps the target height rather than blowing photos up. Must still fit the container.
    rows.push({
      items: current,
      height: Math.round(Math.min(target, heightFor(current.length, ratioSum))),
      ratios: ratioSum,
      partial: true
    });
  }

  // Round widths cumulatively so rounding error never accumulates: a full row ends flush with the container.
  for (const row of rows) {
    const available = containerWidth - GAP * (row.items.length - 1);
    const scale = row.partial ? row.height : available / row.ratios;
    let edge = 0;
    row.widths = row.items.map((photo, index) => {
      const next = Math.round((edge + photo.ratio) * scale);
      const width = next - Math.round(edge * scale);
      edge += photo.ratio;
      return index === row.items.length - 1 && !row.partial
        ? available - Math.round((edge - photo.ratio) * scale)
        : width;
    });
  }
  return rows;
}

// clientWidth includes padding, so measure the actual content box.
function contentWidth(element) {
  const style = getComputedStyle(element);
  return element.clientWidth
    - parseFloat(style.paddingLeft)
    - parseFloat(style.paddingRight);
}

function renderRows(indexOf) {
  const fragment = document.createDocumentFragment();
  const containerWidth = Math.floor(contentWidth(gallery));

  for (let month = 1; month <= 12; month++) {
    const photos = data.photos.filter(photo => photo.month === month);
    if (!photos.length) continue;

    fragment.append(monthHeading(month));

    for (const row of buildRows(photos, containerWidth)) {
      const element = document.createElement('div');
      element.className = 'row';
      row.items.forEach((photo, index) => {
        element.append(makeTile(photo, indexOf.get(photo.id), {
          width: row.widths[index],
          height: row.height,
          showDay: 'full'
        }));
      });
      fragment.append(element);
    }
  }
  return fragment;
}

/* ---------- calendar ---------- */

function renderCalendar(indexOf) {
  const fragment = document.createDocumentFragment();
  const byId = new Map(data.photos.map(photo => [photo.id, photo]));
  const grid = document.createElement('div');
  grid.className = 'calendar';

  for (let month = 1; month <= 12; month++) {
    const total = daysInMonth(data.year, month);

    const section = document.createElement('section');
    section.className = 'calendar-month';
    section.append(monthHeading(month, 'compact'));

    const sheet = document.createElement('div');
    sheet.className = 'sheet';

    const weekdays = document.createElement('div');
    weekdays.className = 'weekdays';
    weekdays.setAttribute('aria-hidden', 'true');
    for (const label of WEEKDAYS) {
      const span = document.createElement('span');
      span.textContent = label;
      weekdays.append(span);
    }
    sheet.append(weekdays);

    const days = document.createElement('div');
    days.className = 'days';

    const blank = () => {
      const cell = document.createElement('div');
      cell.className = 'cell blank';
      cell.setAttribute('aria-hidden', 'true');
      return cell;
    };

    const offset = new Date(data.year, month - 1, 1).getDay();
    for (let i = 0; i < offset; i++) days.append(blank());

    for (let day = 1; day <= total; day++) {
      const photo = byId.get(`${month}-${day}`);
      if (photo) {
        const tile = makeTile(photo, indexOf.get(photo.id), {
          showDay: 'day',
          src: photo.tile
        });
        tile.classList.add('cell');
        days.append(tile);
      } else {
        const cell = document.createElement('div');
        cell.className = 'cell missing';
        const mark = document.createElement('span');
        mark.className = 'daymark';
        mark.textContent = String(day);
        cell.append(mark);
        cell.title = `No photo for ${MONTHS[month - 1]} ${day}`;
        days.append(cell);
      }
    }

    // Pad the last week so every month sheet is a clean rectangle.
    while (days.children.length % 7 !== 0) days.append(blank());

    sheet.append(days);
    section.append(sheet);
    grid.append(section);
  }

  fragment.append(grid);
  return fragment;
}

/* ---------- render ---------- */

function render() {
  const indexOf = new Map(data.photos.map((photo, index) => [photo.id, index]));
  gallery.replaceChildren(view === 'calendar' ? renderCalendar(indexOf) : renderRows(indexOf));
  for (const button of viewButtons) {
    button.setAttribute('aria-pressed', String(button.dataset.view === view));
  }
}

function setView(next) {
  if (next === view) return;
  view = next;
  localStorage.setItem(STORAGE_KEY, view);
  render();
}

/* ---------- lightbox ---------- */

const pageChrome = [...document.querySelectorAll('body > :not(.lightbox)')];

function setPageInert(on) {
  for (const el of pageChrome) el.inert = on;
}

function openLightbox(index) {
  if (index < 0 || index >= data.photos.length) return;
  lastFocused = document.activeElement;
  lightboxIndex = index;
  showLightboxPhoto();
  lightbox.hidden = false;
  setPageInert(true);
  document.body.style.overflow = 'hidden';
  lightbox.querySelector('.lb-close').focus();
}

function showLightboxPhoto() {
  const photo = data.photos[lightboxIndex];
  lbImage.src = photo.full;
  lbImage.alt = altFor(photo);
  lbDate.textContent = formatDate(photo);
  lbCaption.textContent = photo.caption;
  lbCw.textContent = photo.cw;
  lbCw.hidden = !photo.cw;

  // Warm the neighbours so arrow keys feel instant.
  for (const offset of [-1, 1]) {
    const neighbour = data.photos[lightboxIndex + offset];
    if (neighbour) new Image().src = neighbour.full;
  }
}

function stepLightbox(delta) {
  const next = lightboxIndex + delta;
  if (next < 0 || next >= data.photos.length) return;
  lightboxIndex = next;
  showLightboxPhoto();
}

function closeLightbox() {
  lightbox.hidden = true;
  setPageInert(false);
  lbImage.removeAttribute('src');
  document.body.style.overflow = '';
  lightboxIndex = -1;
  if (lastFocused instanceof HTMLElement) lastFocused.focus();
}

/* ---------- events ---------- */

gallery.addEventListener('click', event => {
  const tile = event.target.closest('.tile');
  if (tile) openLightbox(Number(tile.dataset.index));
});

for (const button of viewButtons) {
  button.addEventListener('click', () => setView(button.dataset.view));
}

lightbox.addEventListener('click', event => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'close') closeLightbox();
  else if (action === 'prev') stepLightbox(-1);
  else if (action === 'next') stepLightbox(1);
  else if (event.target === lightbox) closeLightbox();  // click the backdrop
});

document.addEventListener('keydown', event => {
  if (lightbox.hidden) return;
  if (event.key === 'Escape') closeLightbox();
  else if (event.key === 'ArrowLeft') stepLightbox(-1);
  else if (event.key === 'ArrowRight') stepLightbox(1);
  else return;
  event.preventDefault();
});

let resizeTimer;
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (view !== 'rows' || window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

/* ---------- boot ---------- */

function init() {
  if (!data.photos.length) {
    gallery.innerHTML = '<p class="status">No photos.</p>';
    return;
  }

  render();
}

init();</script>
</body>
</html>
