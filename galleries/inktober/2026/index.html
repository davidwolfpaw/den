<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>david's Inktober 2026</title>

<meta name="description" content="david's Inktober 2026: one Pokémon per prompt, every day of October">
<style>
  :root {
    color-scheme: light dark;

    --base: #fefefe;
    --base-dark: #123260;
    --foreground: #0b254c;
    --foreground-light: #fefefe;
    --primary: #1fa6d8;
    --secondary: #f25d54;
    --secondary-dark: #c47a7a;
    --accent: #861d9b;
    --accent-dark: #5d1470;
    --gold: #d4af37;
    --tooltip-bg: #330a0a;

    --pride-black: #000000;
    --pride-brown: #784f16;
    --pride-red: #e40303;
    --pride-orange: #ff8c00;
    --pride-yellow: #ffed00;
    --pride-green: #008026;
    --pride-blue: #004dff;
    --pride-purple: #750787;
    --pride-silver: #bcc4c7;
    --pride-white: #f2f2f2;
    --pride-light-green: #b7f584;

    --rainbow-red: #ff0000;
    --rainbow-orange: #ff7f00;
    --rainbow-yellow: #ffff00;
    --rainbow-lime: #00ff00;
    --rainbow-blue: #0000ff;
    --rainbow-indigo: #4b0082;
    --rainbow-violet: #8b00ff;

    --text: var(--foreground);
    --background: var(--base);
    --surface: var(--base);
    --text-dim: color-mix(in srgb, var(--text) 68%, var(--background));
    --link: var(--pride-purple);
    --link-visited: var(--accent-dark);
    --link-hover: var(--secondary);
    --role-primary: var(--primary);
    --primary-ink: var(--foreground);
    --role-secondary: var(--secondary);
    --role-accent: var(--accent);
    --rule: rgba(11, 37, 76, 0.12);

    --font-serif: Piazzolla, 'Source Serif Pro', 'Iowan Old Style', Palatino, Georgia, serif;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    --font-system: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --text-small: 1rem;
    --text-medium: clamp(1.125rem, 1.1rem + 0.25vw, 1.25rem);
    --text-large: clamp(1.75rem, 1.7rem + 0.5vw, 1.875rem);
    --text-x-large: 2.25rem;
    --text-xx-large: clamp(4rem, 3.5rem + 2.5vw, 5rem);

    --weight-body: 400;
    --weight-heading: 600;
    --weight-strong: 700;
    --weight-display: 900;

    --leading-body: 1.6;
    --leading-heading: 1.2;

    --space-30: clamp(1.5rem, 5vw, 2rem);
    --space-40: clamp(1.8rem, 1.8rem + ((1vw - 0.48rem) * 2.885), 3rem);
    --space-50: clamp(2.5rem, 8vw, 4.5rem);
    --space-60: clamp(3.75rem, 10vw, 7rem);
    --space-70: clamp(5rem, 5.25rem + ((1vw - 0.48rem) * 9.096), 8rem);
    --space-80: clamp(7rem, 14vw, 11rem);
    --block-gap: 1.5rem;
    --page-pad: var(--space-30);

    --content-width: 44rem;
    --wide-width: 64rem;

    --radius-button: 10px;
    --radius-tag: 0;

    --shadow-primary: -10px 10px var(--role-accent);
    --shadow-crisp: var(--background) -6px 6px 0 -4px, var(--role-accent) -6px 6px 0 0;
    --shadow-crisp-primary: var(--background) -6px 6px 0 -4px, var(--role-primary) -6px 6px 0 0;

    --ease-theme: 0.6s;    --ease-ui: 0.2s;  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --text: var(--foreground-light);
      --background: var(--base-dark);
      --surface: var(--foreground);
      --link: var(--pride-silver);
      --link-visited: #99a4a8;
      --link-hover: var(--secondary-dark);
      --role-secondary: var(--secondary-dark);
      --role-accent: var(--accent-dark);
      --rule: rgba(254, 254, 254, 0.12);
    }
  }

  :root[data-theme="dark"] {
    --text: var(--foreground-light);
    --background: var(--base-dark);
    --surface: var(--foreground);
    --link: var(--pride-silver);
    --link-visited: #99a4a8;
    --link-hover: var(--secondary-dark);
    --role-secondary: var(--secondary-dark);
    --role-accent: var(--accent-dark);
    --rule: rgba(254, 254, 254, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 var(--page-pad);
    background: var(--background);
    color: var(--text);
    font-family: var(--font-serif);
    font-size: var(--text-medium);
    font-weight: var(--weight-body);
    font-style: normal;
    line-height: var(--leading-body);
    transition: background-color var(--ease-theme), color var(--ease-theme);
  }

  .content,
  main > *:not(.wide):not(.full) {
    max-width: var(--content-width);
    margin-inline: auto;
  }

  .wide { max-width: var(--wide-width); margin-inline: auto; }
  .full { max-width: none; }

  main > * + * { margin-top: var(--block-gap); }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-serif);
    font-weight: var(--weight-heading);
    font-style: normal;
    line-height: var(--leading-heading);
    margin: 0;
  }

  h1 { font-size: var(--text-x-large); }
  h2 { font-size: var(--text-large); }
  h3 { font-size: var(--text-medium); }

  .display {
    font-size: var(--text-xx-large);
    font-weight: var(--weight-display);
    line-height: 1;
  }

  small, .small { font-size: var(--text-small); }

  a { color: var(--link); text-decoration: underline; transition: color var(--ease-ui); }
  a:hover, a:focus { color: var(--link-hover); }
  a:visited { color: var(--link-visited); }

  :focus-visible { outline: 2px solid var(--role-primary); outline-offset: 2px; }

  header { padding-block: var(--space-30); }

  .button {
    display: inline-block;
    padding: 0.6em 1.2em;
    border: 0;
    border-radius: var(--radius-button);
    background: var(--role-primary);
    color: var(--primary-ink);
    font: inherit;
    font-weight: var(--weight-heading);
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--ease-ui), box-shadow var(--ease-ui);
  }

  .button:hover,
  .button:visited:hover { background: var(--accent-dark); color: var(--base); box-shadow: var(--shadow-crisp-primary); }
  .button:focus { background: var(--role-primary); color: var(--primary-ink); }
  .button:active { background: var(--accent-dark); color: var(--base); }
  .button:visited { color: var(--primary-ink); }

  .button-quiet {
    background: none;
    color: var(--text);
    box-shadow: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    opacity: 0.45;
    padding: 2px 0;
    font-weight: var(--weight-heading);
    transition: opacity var(--ease-ui), border-color var(--ease-ui);
  }

  .button-quiet:hover,
  .button-quiet[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--role-accent); color: var(--text); }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: var(--radius-tag);
    background: var(--role-primary);
    color: var(--primary-ink);
    font-size: 0.7rem;
    font-weight: var(--weight-strong);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
    gap: var(--block-gap);
  }

  .card {
    display: block;
    padding: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    text-decoration: none;
    transition: box-shadow var(--ease-ui);
  }

  a.card,
  a.card:hover,
  a.card:focus,
  a.card:visited { color: var(--text); }

  .card:hover { box-shadow: var(--shadow-crisp); }
  .card:hover .card-title { color: var(--role-accent); }

  .card-title {
    font-family: var(--font-serif);
    font-size: var(--text-large);
    font-weight: var(--weight-strong);
    transition: color var(--ease-ui);
  }

  .card-meta { font-size: var(--text-small); opacity: 0.75; margin: 0.15rem 0 0; }

  .card > :last-child { margin-bottom: 0; }

  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 0;
    object-fit: cover;
    background: var(--background);
    margin-bottom: 0.5rem;
  }

  @keyframes rainbow-drift {
    from { background-position: 0% 0; }
    to { background-position: -200% 0; }
  }

  .rainbow-text {
    font-size: 2em;
    font-weight: var(--weight-strong);
    background-image: linear-gradient(90deg,
      var(--rainbow-red), var(--rainbow-orange), var(--rainbow-yellow), var(--rainbow-lime), var(--rainbow-blue), var(--rainbow-indigo), var(--rainbow-violet),
      var(--rainbow-red), var(--rainbow-orange), var(--rainbow-yellow), var(--rainbow-lime), var(--rainbow-blue), var(--rainbow-indigo), var(--rainbow-violet),
      var(--rainbow-red));
    background-size: 200% 100%;
    background-repeat: repeat-x;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: rainbow-drift 18s linear infinite;
  }

  .rainbow-text:hover { animation-direction: reverse; }

  footer {
    max-width: var(--content-width);
    margin: var(--space-50) auto 0;
    padding-block: var(--space-30);
    border-top: 1px solid var(--rule);
    font-size: var(--text-small);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
<style>
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
  gap: var(--block-gap);
}

.card {
  display: grid;
  align-content: start;
  gap: 0.1rem;
  text-align: left;
  font: inherit;
  cursor: pointer;
}

.card img { aspect-ratio: 1; }

.card-title { font-size: var(--text-medium); font-weight: var(--weight-strong); }
.card-meta { margin: 0; }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: var(--space-30);
  background: rgb(11 37 76 / 0.94);
}

.lightbox[hidden] { display: none; }

.lb-figure {
  margin: 0;
  display: grid;
  gap: var(--block-gap);
  justify-items: center;
  max-height: 100%;
}

.lb-figure img {
  max-width: min(92vw, 1400px);
  max-height: 72vh;
}

.lb-figure figcaption {
  display: grid;
  gap: 0.25rem;
  color: var(--foreground-light);
  text-align: center;
}

.lb-prompt { font-size: var(--text-large); font-weight: var(--weight-heading); }
.lb-sub { font-size: var(--text-small); opacity: 0.75; }

.lb-video, .lb-video:visited { color: var(--foreground-light); }
.lb-video:hover { color: var(--gold); }

.lb-close, .lb-nav {
  position: fixed;
  display: grid;
  place-items: center;
  appearance: none;
  border: 0;
  padding: 0;
  background: var(--primary);
  color: var(--primary-ink);
  font-family: var(--font-sans);
  line-height: 1;
  cursor: pointer;
  transition: background-color var(--ease-ui), box-shadow var(--ease-ui);
}

.lb-close:hover, .lb-nav:hover { background: var(--accent); color: var(--base); box-shadow: var(--shadow-crisp-primary); }

.lightbox :focus-visible { outline: 2px solid var(--foreground-light); outline-offset: 2px; }

.lb-close {
  top: var(--space-30);
  right: var(--space-30);
  width: 44px;
  height: 44px;
  border-radius: var(--radius-button);
  font-size: 28px;
}

.lb-nav {
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 64px;
  border-radius: var(--radius-button);
  font-size: 32px;
}

.lb-prev { left: var(--space-30); }
.lb-next { right: var(--space-30); }
</style>
</head>
<body>
<header class="wide">
  <p class="small"><a href="https://david.garden">david.garden</a> › <a href="../../">galleries</a> › <a href="../">inktober</a></p>
  <h1>david's Inktober 2026</h1>
  <p>One drawing a day for October, every prompt answered with a Pokémon that fit the word. Each one has a <a href="https://www.youtube.com/playlist?list=PLdbzyXche8nc">YouTube Short</a> too.</p>
</header>

<main>
  <div class="grid wide" id="grid"></div>
</main>

<footer class="wide">
  Part of <a href="/">den.david.garden</a>. Code MIT, content CC BY-SA 4.0.
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Drawing" hidden>
  <button type="button" class="lb-close" data-action="close" aria-label="Close">&times;</button>
  <button type="button" class="lb-nav lb-prev" data-action="prev" aria-label="Previous drawing">&#8249;</button>
  <button type="button" class="lb-nav lb-next" data-action="next" aria-label="Next drawing">&#8250;</button>
  <figure class="lb-figure">
    <img id="lb-image" alt="">
    <figcaption>
      <span class="lb-prompt" id="lb-prompt"></span>
      <span class="lb-sub" id="lb-sub"></span>
      <a class="lb-video" id="lb-video" href="#" target="_blank" rel="noopener noreferrer">Watch the drawing process on YouTube</a>
    </figcaption>
  </figure>
</div>

<script type="module">
const DRAWINGS = [
  [1, "Apple", "Applin", "Applin, a round red apple with a pale green leaf for a head and two wide eyes peeking over the top, resting in grass at the foot of a tree.", "Bl00XP-f59s"],
  [2, "Relic", "Relicanth", "Relicanth, a heavy teal and grey prehistoric fish with a cream-colored head, drifting over rocks in deep blue water as bubbles rise around it.", "5PPWB_ZSwHk"],
  [3, "Miniature", "Joltik", "Joltik, a tiny yellow spiky bug Pokémon, almost lost in the middle of a pattern of oversized orange and green autumn leaves.", "77M-WxIN-Og"],
  [4, "Cactus", "Cacnea and Maractus", "Maractus and Cacnea, two green cactus Pokémon planted in terracotta pots on a table. Maractus holds up its pink flowered arms while the small round Cacnea leans out of the smaller pot.", "ifIvfjdesEc"],
  [5, "Smack", "Hariyama", "Hariyama, a navy blue sumo wrestler Pokémon with enormous orange palms, swinging an open-handed slap on a sunny green hill.", "LPuWTYrgMqY"],
  [6, "Ogre", "Emboar", "Emboar, a big boar Pokémon with a beard of orange flame and a gold-patterned black tunic, flexing both arms in a purple and red room.", "DHdVBwZx8_Y"],
  [7, "Panic", "Whismur", "Whismur, a pale purple Pokémon with huge yellow ears, eyes screwed shut into X shapes and mouth open mid-cry, crowded in by a blur of other Whismur.", "tf-SrA6MNRQ"],
  [8, "Stinky", "Stunky and Garbodor", "Stunky, a purple and cream skunk Pokémon, raising its tail in front of Garbodor, a slouching green trash-bag Pokémon, against a brick wall.", "jr-w7eQAwQM"],
  [9, "Ram", "Rampardos", "Rampardos, a grey dinosaur Pokémon with a blue domed skull and white spikes, charging head-down across a burst of red speed lines.", "mhdAkJRhQPU"],
  [10, "Mystical", "Mew", "Mew, a small pink feline Pokémon with a long tail, floating curled up inside a soap bubble in deep blue water.", "z4hVI2M9FiU"],
  [11, "Rescue", "Chansey", "Chansey, a pink egg-shaped Pokémon smiling with its white egg tucked in its belly pouch, in front of soft multicolored bokeh circles.", "8KTjd_dRY4Q"],
  [12, "Toss", "Throh", "Throh, a dark red judo Pokémon in a white gi and black belt, crouched low with both hands open, ready to throw someone.", "hpO0kR4SH60"],
  [13, "Flimsy", "Magikarp", "Magikarp, an orange-red fish Pokémon with a gaping mouth and droopy whiskers, flopping helplessly in shallow water, painted in loose brushstrokes.", "-NiSQHHSZUw"],
  [14, "Lady", "Lilligant", "Lilligant, a flower Pokémon whose leaves fall like a yellow-green ballgown and whose pink petals sit like a crown, standing beside a tree under a blue sky.", "Wze1Aia-LAY"],
  [15, "Hooray", "Plusle and Minun", "Plusle and Minun, two cheerful yellow mouse Pokémon with plus and minus ear markings, cheering with red and blue pompoms under a shower of confetti.", "_DuNcTGdaVI"],
  [16, "Gangly", "Gengar", "Gengar, a round purple ghost Pokémon with a wide toothy grin and red eyes, grinning out of a glitched, smeared purple background.", "gpaMRMYYS24"],
  [17, "Contraption", "Klinklang", "Klinklang, a Pokémon made of three interlocking steel gears with a red cross-shaped gear and a spinning arrow ring, against a blue corrugated background.", "4FrkqIKm-1Y"],
  [18, "Flightless", "Dodrio", "Dodrio, a brown three-headed bird Pokémon on long legs, each head wearing a different expression, with tiny useless pink wings at its back.", "tGuOhL6k_7E"],
  [19, "Confused", "Psyduck", "Psyduck, a yellow duck Pokémon holding its head with both hands and staring blankly, surrounded by floating purple and blue question marks.", "rLZCEhAlwsE"],
  [20, "Lounge", "Slaking", "Slaking, a big brown and cream sloth-like Pokémon, slouched back on the grass with a bored expression, scratching its head among the trees.", "yX2dCsBezmI"],
  [21, "Hero", "Hawlucha", "Hawlucha, a green and red luchador bird Pokémon with a white chest, leaping with its wings spread and beak open in the ropes of a wrestling ring.", "arWyf_KJE2Y"],
  [22, "Beacon", "Ampharos", "Ampharos, a yellow sheep Pokémon with black-striped ears and tail, curled up as the red orb on its tail flares with light against lightning bolts.", "f0Ov8w8RO1U"],
  [23, "Dapper", "Mr. Rime", "Mr. Rime, a tall mime Pokémon in a dark hat with a curly mustache marking on its belly, tipping an icy cane in front of a red brick wall.", "aLJdp5J_JuE"],
  [24, "Bake", "Fidough and Dachsbun", "Dachsbun, a baked brown dog Pokémon, standing over Fidough, a small pale dough puppy, the two of them on a large white plate in a sunny kitchen.", "y705E4_n3Wk"],
  [25, "Fracture", "Fraxure", "Fraxure, a grey dragon Pokémon with green scales and long white tusks, standing on cracked dry ground beside a river.", "VLVitiBK3aA"],
  [26, "Zip", "Banette", "Banette, a grey puppet Pokémon with a zipper for a mouth and a jagged zipper pull hanging from one hand, hovering against a starry night sky.", "GO-RPXTE8uM"],
  [27, "Dumb", "Slowpoke", "Slowpoke, a pink Pokémon lying flat on a beach with a vacant open-mouthed stare, a Shellder sitting in the sand behind it.", "SbmAqx8q03s"],
  [28, "Trophy", "Gholdengo", "Gholdengo, a slim golden Pokémon made of coins, posing on a wooden pedestal like an award statue, surrounded by sparkling gems.", "d_hb5raYgpM"],
  [29, "Tusk", "Donphan", "Donphan, a grey elephant Pokémon with a thick black tire-like tread around its body and long white tusks, standing in a sunny flower-dotted field.", "RPa-zoHZ5ms"],
  [30, "Cookie", "Munchlax", "Munchlax, a chubby blue-green Pokémon with its eyes closed in delight, eating chocolate chip cookies on a red checkered picnic blanket.", "aWrQR3Ey-54"],
  [31, "Flex", "Machamp", "Machamp, a blue four-armed Pokémon in black swim trunks, flexing all four arms at once on a sunny beach.", "lPeyLqCzCWY"]
];

const grid = document.getElementById('grid');
const lightbox = document.getElementById('lightbox');
const lbImage = document.getElementById('lb-image');
const lbPrompt = document.getElementById('lb-prompt');
const lbSub = document.getElementById('lb-sub');
const lbVideo = document.getElementById('lb-video');
let current = -1;

for (const [index, [day, word, who, alt, video]] of DRAWINGS.entries()) {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card.dataset.day = day;
  card.innerHTML = `
    <img src="img/tile/${day}.webp" alt="${alt.replace(/"/g, '&quot;')}" loading="lazy" decoding="async" width="200" height="200">
    <span class="card-title">${word}</span>
    <span class="card-meta">Day ${day} · ${who}</span>`;
  card.addEventListener('click', () => open(index));
  grid.append(card);
}

const pageChrome = [...document.querySelectorAll('body > :not(.lightbox)')];

function setPageInert(on) {
  for (const el of pageChrome) el.inert = on;
}

function open(index) {
  current = (index + DRAWINGS.length) % DRAWINGS.length;
  const [day, word, who, alt, video] = DRAWINGS[current];
  lbImage.src = `img/full/${day}.webp`;
  lbImage.alt = alt;
  lbPrompt.textContent = word;
  lbSub.textContent = `Day ${day} · ${who}`;
  lbVideo.href = `https://www.youtube.com/shorts/${video}`;
  lightbox.hidden = false;
  setPageInert(true);
  document.body.style.overflow = 'hidden';
  lightbox.querySelector('.lb-close').focus();
}

function close() {
  lightbox.hidden = true;
  setPageInert(false);
  document.body.style.overflow = '';
  const card = grid.querySelector(`.card[data-day="${DRAWINGS[current][0]}"]`);
  if (card) card.focus();
}

lightbox.addEventListener('click', event => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'close' || event.target === lightbox) close();
  else if (action === 'prev') open(current - 1);
  else if (action === 'next') open(current + 1);
});

document.addEventListener('keydown', event => {
  if (lightbox.hidden) return;
  if (event.key === 'Escape') close();
  else if (event.key === 'ArrowLeft') open(current - 1);
  else if (event.key === 'ArrowRight') open(current + 1);
});
</script>
</body>
</html>
